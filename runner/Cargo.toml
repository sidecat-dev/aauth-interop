[package]
name = "aauth-interop-runner"
version = "0.1.0"
edition = "2024"
description = "Runs aauth-rust and aauth-go against each other over HTTPS, as a consumer would build them"
license = "MIT"
repository = "https://gitlab.com/sidecat-dev/aauth-interop"
publish = false

[dependencies]
# The aauth-rust checkout that ../run.sh fetches at the requested ref.
aauth-rust-jose = { path = "../targets/aauth-rust/crates/aauth-rust-jose" }
aauth-rust-core = { path = "../targets/aauth-rust/crates/aauth-rust-core" }
aauth-rust-signature-key = { path = "../targets/aauth-rust/crates/aauth-rust-signature-key" }
aauth-rust-budgets = { path = "../targets/aauth-rust/crates/aauth-rust-budgets" }
aauth-rust-r3 = { path = "../targets/aauth-rust/crates/aauth-rust-r3" }
aauth-rust-resource = { path = "../targets/aauth-rust/crates/aauth-rust-resource" }
aauth-rust-agent = { path = "../targets/aauth-rust/crates/aauth-rust-agent" }
aauth-rust-agent-provider = { path = "../targets/aauth-rust/crates/aauth-rust-agent-provider" }
aauth-rust-person-server = { path = "../targets/aauth-rust/crates/aauth-rust-person-server" }
aauth-rust-person-server-redb = { path = "../targets/aauth-rust/crates/aauth-rust-person-server-redb" }
aauth-rust-access-server = { path = "../targets/aauth-rust/crates/aauth-rust-access-server" }
aauth-rust-supervision-server = { path = "../targets/aauth-rust/crates/aauth-rust-supervision-server" }
base64 = "0.22"
http = "1"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.13"
ring = "0.17"
rsa = { version = "=0.9.8", default-features = false, features = ["std", "u64_digit", "sha2"] }
sha2 = "0.10"
httparse = "1"
